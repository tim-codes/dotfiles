# MCP servers scripts/claude-reauth expects to be connected, per context.
#
# Names are EXACTLY as `claude mcp list` prints them under that context's
# CLAUDE_CONFIG_DIR: user-scope servers by their own name (`Sanity`,
# `datadog`), claude.ai account connectors as `claude.ai <Name>`, plugin
# servers as `plugin:<plugin>:<server>`. The same names work for
# `claude mcp get` / `claude mcp login`.
#
#   servers  — required: absent or not connected counts against the exit code
#              (a required claude.ai connector that is absent → needs-auth,
#              "attach <Name> at claude.ai for <account>")
#   optional — checked only if the context lists it; absent → skipped
#
# [all] applies to every context. Tables are personal, reserve, exxo, exxo-personal.
# Kept to the subset the parser in claude-reauth reads: [table] headers,
# `servers`/`optional` string arrays (single- or multi-line), # comments.

# MCP parity (Tim, 22 Nov 2026): every repo-managed server in mcp.shared.json is
# required in every attended context, so any of them can take any work.
# claude-sync resets a per-project "Disabled for this project" flag on these.
[all]
servers = ["mantine", "Sanity", "datadog", "boards", "workos", "playwright", "vercel", "squad", "figma"]

# Connectors: the repo-managed server or plugin is preferred wherever both exist,
# so claude.ai Figma (→ the `figma` server, Figma's own endpoint), claude.ai
# Datadog (→ `datadog`, EU site) and claude.ai Linear (→ plugin:linear:linear)
# are never required. Notion and Slack have no repo-managed server and stay
# claude.ai connectors (they follow the logged-in ACCOUNT, attached at
# claude.ai/customize/connectors). The Google connectors are personal-only and
# outside parity.
[personal]
servers = ["claude.ai Notion", "claude.ai Slack"]
optional = ["claude.ai Gmail", "claude.ai Google Calendar", "claude.ai Google Drive"]

# Second personal subscription, built from the personal fragments.
[reserve]
servers = ["claude.ai Notion", "claude.ai Slack"]

# Microsoft 365 is tied to the Exxo tenant: exxo only.
[exxo]
servers = [
  "claude.ai Microsoft 365",
  "claude.ai Notion",
  "claude.ai Slack",
]

# Same exxo fragments, personal subscription: the claude.ai connectors follow
# the logged-in ACCOUNT, so none is required here; the managed servers in [all]
# are what make it interchangeable.
[exxo-personal]
servers = []
