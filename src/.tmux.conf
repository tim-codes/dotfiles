# references:
# - https://github.com/omerxx/dotfiles/blob/master/tmux/tmux.conf

# The server keeps the PATH of whichever client started it. The Ghostty
# dropdown starts tmux via `bash --noprofile --norc` (see ghostty/config), so
# when it wins the race at login the server's PATH is the bare system default
# and every run-shell that calls `tmux` fails - TPM loads no plugins at all,
# so no keybindings, theme or continuum restore. Prepend the homebrew prefixes
# (both, apple silicon and intel) when they're missing; the guard keeps
# reloads from stacking duplicates. Must stay above the tpm run line.
if-shell -F "#{m:*:/opt/homebrew/bin:*,:#{E:PATH}:}" "" "set-environment -g PATH \"/opt/homebrew/bin:/usr/local/bin:$PATH\""

# setup truecolor support
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ",alacritty*:RGB"
# ghostty (the dropdown terminal) reports TERM=xterm-ghostty, which the line
# above does not match - without this the scratch session loses truecolor
set-option -sa terminal-features ",xterm-ghostty:RGB"

# Claude Code inside tmux: without allow-passthrough its desktop notifications
# and progress indicator are swallowed by tmux, and without extended keys
# Shift+Enter is indistinguishable from Enter (it submits instead of inserting
# a newline). Both terminals are listed for extkeys for the same reason as RGB.
set -g allow-passthrough on
set -s extended-keys on
set-option -sa terminal-features ",alacritty*:extkeys,xterm-ghostty:extkeys"

# force utf8 mode (nvim complains alot)
setw -gq utf8 on

# use fish inside tmux (homebrew path on mac, system path on linux)
if-shell "test -x /opt/homebrew/bin/fish" "set -g default-shell /opt/homebrew/bin/fish"
if-shell "test -x /usr/bin/fish" "set -g default-shell /usr/bin/fish"
set-window-option -g mode-keys vi

# remap prefix from 'C-b' to 'C-a'. Day to day it's pressed as Cmd+. - tmux
# can't see Cmd, so alacritty.toml and the ghostty config translate Cmd+.
# into C-a (\x01). C-a keeps working directly (ssh, other terminals).
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# map clear key
# https://unix.stackexchange.com/questions/527344/how-to-clear-tmux-and-zsh-history-with-one-keypress#comment976797_527711
# Was -n C-k, but vim-tmux-navigator claims C-h/j/k/l in the root table for
# seamless nvim<->tmux pane movement, so this moves behind the prefix.
bind-key k send-keys -R ^M \; clear-history

# resize panes with Alt+hjkl, no prefix - the same keys as pane navigation
# (C-hjkl), with Alt swapped in for Ctrl. Alt reaches tmux only from the LEFT
# Option key: alacritty.toml (option_as_alt) and the ghostty config
# (macos-option-as-alt) make just that one Alt, so right Option still types
# # and € on the UK layout. Where Option isn't Alt (iTerm2, whose profile keeps
# both at "Normal"), Opt+h types ˙ as before and these never fire. Costs fish's
# Alt+h (man page) and Alt+l (ls) inside tmux.
bind-key -n M-h resize-pane -L 5
bind-key -n M-j resize-pane -D 5
bind-key -n M-k resize-pane -U 5
bind-key -n M-l resize-pane -R 5

# Enable mouse control (clickable windows, panes, resizable panes). Also what
# lets the tmux-home popup receive real wheel events: with mouse off the
# terminal turns the wheel into up/down arrows, which move the popup's list
# instead of scrolling its preview. Wheel over a plain pane enters copy-mode
# scrollback; hold Option (Shift in some terminals) for native selection.
set -g mouse on

# use system clipboard
set -g set-clipboard on

# zero-out escape time delay. tmux-sensible would do this, but its guard only
# fires if escape-time is still tmux's old 500 default - tmux 3.7 ships 10, so
# the guard never matches and the value was silently tmux's, not ours.
# https://unix.stackexchange.com/a/608179
set -g escape-time 0

# don't exit from tmux when closing a session
set -g detach-on-destroy off

# start indexing windows at 1 instead of 0
set -g base-index 1

# renumber all windows when any window is closed
set -g renumber-windows on

# plugins
# Declared as full git@ URLs: TPM tries the @plugin value verbatim as a git URL
# first and only falls back to expanding owner/repo over anonymous HTTPS, so
# this keeps every clone under ~/.tmux/plugins on SSH like every other remote.
set -g @plugin 'git@github.com:tmux-plugins/tpm'
set -g @plugin 'git@github.com:catppuccin/tmux'
set -g @plugin 'git@github.com:tmux-plugins/tmux-sensible'
set -g @plugin 'git@github.com:tmux-plugins/tmux-resurrect'
set -g @plugin 'git@github.com:tmux-plugins/tmux-continuum'
# tmux-yank dropped: set-clipboard on plus tmux's native OSC 52 already cover
# copy-mode y and mouse-drag copy, and its remaining extras (prefix-y/-Y) were
# unused. prefix+y is now tmux-claude-hatch's launcher.
# seamless C-h/j/k/l between nvim splits and tmux panes (nvim side is a
# matching plugin spec in src/.config/nvim)
set -g @plugin 'git@github.com:christoomey/vim-tmux-navigator'
# agent fleet: prefix+y launches, prefix+u lists sessions with live
# working/waiting/idle state read from `claude agents --json`, and rings the
# window that needs attention
set -g @plugin 'git@github.com:craftzdog/tmux-claude-hatch'
# Retired agent sidebar, superseded by tmux-home's sidebar (below). Still
# installed only so Claude sessions started before the cutover, whose hooks
# call its hook.sh, keep working; nothing of it is bound or auto-created.
# Remove (with scripts/tmux-plugins' build of it) once those have restarted.
set -g @plugin 'git@github.com:hiroppy/tmux-agent-sidebar'
# fzf popup for managing windows/sessions/panes - rename, move, swap, kill,
# with preview. prefix+F (plugin default). Fills the gaps in tree mode, which
# can't rename and can't take custom keys.
set -g @plugin 'git@github.com:sainnhe/tmux-fzf'
# Full-window window manager popup (own repo), on prefix+. (was move-window;
# w stays tree mode, f stays tmux-fzf for comparison while testing), and its
# read-only agent/window sidebar on prefix+e (this window) / prefix+E (this
# session) - its default @home-sidebar-keys. Declared after tmux-agent-sidebar
# so its e/E win. Loads before the post-tpm binds below, so nothing there may
# rebind . e E.
set -g @plugin 'git@github.com:tim-codes/tmux-home'
set -g @home-keys '.'
# Sidebars appear on new windows by themselves, except in scratch (the ghostty
# dropdown, where a sidebar is noise in a half-height window). The daemon does
# this from its snapshots - no tmux hooks - and holds off until a continuum
# restore has finished (the hook below tells it), so it never fights resurrect.
set -g @home-sidebar-auto on
set -g @home-sidebar-exclude 'scratch'

# Last saved environment is automatically restored when tmux is started.
set -g @continuum-restore 'on'
# Save every 5 minutes (default 15) so a crash or forced reboot loses less.
# Cheap: resurrect only writes a new snapshot when something changed.
set -g @continuum-save-interval '5'
# Restore tmux-home sidebars as live sidebars, not as dead shells (the pane
# runs `<tmux-home> sidebar --managed`, which this matches), and tell the
# tmux-home daemon when a restore is done so auto-create can start.
set -g @resurrect-processes '"~tmux-home sidebar"'
# Resume Claude Code sessions after a restore (tmux-home pass 7). Each save
# snapshots the panes running claude; each restore types
# `cd <dir> && env CLAUDE_CONFIG_DIR=<account> claude --resume <id>` into
# those panes, staggered. `;` not `&&`: a failing restore-agents must never
# stop @home_restore_done (which gates sidebar auto-create).
set -g @home-restore-agents on
set -g @resurrect-hook-post-save-all '~/.tmux/plugins/tmux-home/target/release/tmux-home agents-snapshot'
set -g @resurrect-hook-post-restore-all '~/.tmux/plugins/tmux-home/target/release/tmux-home restore-agents; tmux set -g @home_restore_done 1'
# Save each pane's scrollback too, so restored panes come back with their
# history instead of empty. Requires default-command to have no && or ||
# (resurrect's known issue) - it's unset here.
set -g @resurrect-capture-pane-contents 'on'

# The retired sidebar ships with @sidebar_auto_create on, which installs an
# unguarded global after-new-window hook; keep it off while it stays installed.
set -g @sidebar_auto_create off

# tmux-fzf reads these tmux environment variables at load time. Windows first:
# renaming/organising windows is what it's here for.
TMUX_FZF_ORDER="window|session|pane|command|keybinding|clipboard|process"
# Full-window popup (plugin default is 62% x 38%); -m keeps multi-select.
TMUX_FZF_OPTIONS="-p -w 100% -h 100% -m"

# :rt reloads this file. Fixed index rather than -a, so a reload overwrites
# the alias instead of appending another copy each time.
set -s command-alias[100] rt='source-file ~/.tmux.conf ; display-message "tmux.conf reloaded"'

# styling
# Two status lines, both on top (tmux draws every status line at the same
# edge). Line 1 is status-left / status-right only, line 2 the window chips
# alone. Both formats are tmux's stock status-format[0] (tmux 3.7/3.8) split
# at the window list, so the left/right/list styling and mouse ranges behave
# exactly as in the single-line default.
set -g status-position top
set -g status 2
set -g status-format[0] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
set -g status-format[1] "#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}"
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# catppuccin
#
# v2 renamed this option to the US spelling. @catppuccin_flavour was therefore
# being ignored — latent rather than visible, since the plugin's own default is
# also mocha, but it would have bitten the moment a different flavour was set.
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
# Window chips: catppuccin's default text is #T, the pane title, which Claude
# Code sets to its session title - so renaming a window (prefix+, or
# tmux-home) changed nothing visible. Show the name once it has been set by
# hand (that turns automatic-rename off), the pane title until then.
set -g @catppuccin_window_text " #{?automatic-rename,#T,#W}"
set -g @catppuccin_window_current_text " #{?automatic-rename,#T,#W}"

# v2 ships the palette and the modules but wires NOTHING into the status line
# itself — without the lines below tmux renders its own stock status bar and the
# plugin appears to do nothing. #{E:...} defers expansion to draw time, so these
# can sit above the tpm run that loads catppuccin.
#
# application/session/date_time are self-contained; the cpu, ram and battery
# modules in the upstream example need tmux-cpu and tmux-battery, which are not
# installed here.
set -g status-left-length 100
set -g status-right-length 100
# Line 1 left: the session, plus - for a tm2 client only - the way out, since
# C-d / C-c there go to the remote pane. homelab's tm2 attaches over ssh with
# TERM=xterm-256color; local terminals report alacritty or xterm-ghostty.
set -g status-left "#{E:@catppuccin_status_session}"
set -ag status-left "#[fg=#{@thm_overlay_1},bg=default]#{?#{==:#{client_termname},xterm-256color}, tm2 detach: (C-a d),}"
# Claude Code's executable is named after its version, so pane_current_command
# reads "2.1.296". @pane_cmd shows the agent's name instead - but only when
# the pane is tagged as an agent AND the command is a bare N.N.N, so an
# unrelated semver-named process is never relabelled. The tag is tmux-home's
# @home_agent, or @pane_agent on sessions started before tmux-home's hook (the
# retired tmux-agent-sidebar's). Used by the application chip and automatic
# window names.
set -g @pane_agent_name '#{?#{@home_agent},#{@home_agent},#{@pane_agent}}'
set -g @pane_cmd '#{?#{&&:#{E:@pane_agent_name},#{m/r:^[0-9]+[.][0-9]+[.][0-9]+$,#{pane_current_command}}},#{E:@pane_agent_name},#{pane_current_command}}'
set -g @catppuccin_application_text " #{E:@pane_cmd}"
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{E:@pane_cmd}}#{?pane_dead,[dead],}'
# Line 1 right: host, time, battery, tmux-home daemon. The running process
# moved to the per-pane border line (after the tpm run below). Note
# tmux-continuum prepends its autosave #() to status-right at load, so
# status-right has to stay in a rendered line or autosave silently stops.
set -g status-right ""
# Host chip: which machine the active pane is looking at. catppuccin's host
# module shows #H - the tmux server's host, which stays local while a pane is
# ssh'd away - so its text is replaced by src/bin/tmux-pane-host: "→ <host>"
# when the pane's foreground job is ssh/mosh, the local short hostname
# otherwise. #{pane_tty} in the command makes tmux re-run it on pane switch.
# Set before tpm loads catppuccin, whose `set -ogq` then keeps this text.
set -g @catppuccin_host_text " #(~/bin/tmux-pane-host '#{pane_tty}')"
set -ag status-right "#{E:@catppuccin_status_host}"
# CPU / memory chips. catppuccin's modules read tmux-cpu's #{cpu_percentage} /
# #{ram_percentage}, which is not installed, so their text is replaced with
# plain macOS commands (both ~20ms, run every status-interval). CPU is the
# summed per-process share over the core count; memory is 100 minus
# memory_pressure's free percentage. %% because status lines are
# strftime-expanded.
set -g @catppuccin_cpu_text " #(ps -A -o pcpu= | awk -v n=\$(sysctl -n hw.ncpu) '{s+=\$1} END {print int(s/n) \"%%\"}')"
set -g @catppuccin_ram_text " #(memory_pressure | awk '/free percentage/{print 100-\$NF \"%%\"}')"
set -ag status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
# Battery chip on machines that have one. catppuccin's module reads
# tmux-battery's #{battery_*}, which is not installed, so its icon and text are
# replaced with pmset's percentage (set before tpm, as for the host chip).
set -g @catppuccin_battery_icon "󰁹 "
# (awk, not a grep for "N%": status lines are strftime-expanded, so a % in the
# command itself is not safe.)
set -g @catppuccin_battery_text " #(pmset -g batt | awk '/InternalBattery/{sub(/;.*/,\"\"); print \$NF}')"
if-shell 'pmset -g batt 2>/dev/null | grep -q InternalBattery' 'set -ag status-right "#{E:@catppuccin_status_battery}"'
# tmux-home daemon chip: ● when this server's daemon answers, ○ when it is
# down (popups then read tmux directly). `status` never starts a daemon, and
# prints nothing until the Rust binary has been built.
set -ag status-right "#[fg=#{@thm_overlay_1},bg=default] #(f=~/.tmux/plugins/tmux-home/target/release/tmux-home; [ -x \$f ] && \$f status --socket '#{socket_path}') "

# Active theme, generated from the alacritty themes by
# scripts/gen-terminal-themes and pointed at by the `theme` fish function.
# This MUST stay above the tpm run below: catppuccin's flavour files use
# `set -ogq`, where -o means "do not set if already set", so setting the
# @thm_* palette first makes catppuccin render its modules in the active
# theme's colours instead of mocha's. -q keeps a missing file silent on a
# machine that has not switched theme yet.
source-file -q ~/.config/tmux/theme.conf

# must be last line of this file
run '~/.config/tmux/tpm-run.sh'

# Prompts (C-a , C-a : C-a $ ...) are drawn over the status line. catppuccin
# sets bg=default there, so only the typed text is painted and the window tabs
# show through around it - with the status bar on top, it's hard to see what
# you're typing. An opaque fill clears the whole line while a prompt is open.
# After tpm because catppuccin sets both styles at load.
set -gF message-style "fg=#{@thm_teal},bg=#{@thm_surface_0},fill=#{@thm_surface_0}"
set -gF message-command-style "fg=#{@thm_teal},bg=#{@thm_surface_0},fill=#{@thm_surface_0}"

# Per-pane status line on each pane's top border: the pane's own process and
# git branch, so they follow the pane rather than the focused one. After tpm
# because catppuccin sets pane-border-format at load. Active pane in teal.
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#{@thm_teal}],#[fg=#{@thm_overlay_1}]} #{E:@pane_cmd}#(cd '#{pane_current_path}' 2>/dev/null && git branch --show-current 2>/dev/null | sed 's/^/  /') #[default]"

# prefix+f: straight into tmux-fzf's window switcher (type to filter, with
# preview) instead of find-window's status-line prompt followed by a tree.
bind f run-shell -b "TMUX_FZF_CLIENT='#{client_tty}' ~/.tmux/plugins/tmux-fzf/scripts/window.sh switch"
