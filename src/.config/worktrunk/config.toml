# worktrunk (wt) user config - applies to every repo. Stowed from dotfiles;
# `wt config` edits land here too since this is a symlink into the repo.
# Reference: wt config --help, https://worktrunk.dev/config

# Sibling worktrees, ../<repo>-<branch> (slashes in the branch -> -): the
# layout the dotfiles CLAUDE.md, the worktree-closedown skill and the
# transcript relocation below all assume. Never nested inside the repo
# (.claude/worktrees-style): indexers and ripgrep would see the nested tree.
worktree-path = "{{ repo_path }}/../{{ repo }}-{{ branch | sanitize }}"

# Before any worktree removal - `wt remove`, `wt merge` cleanup, and Claude's
# own worktrees via the worktrunk plugin's WorktreeRemove hook - move the
# Claude transcripts of sessions that ran there into the primary checkout's
# project slug. Blocking: if it fails, the worktree stays. Values are
# shell-escaped by worktrunk, so no quotes around the template.
[pre-remove]
claude-transcripts = "~/bin/worktree-relocate-transcripts {{ worktree_path }}"

# Every new worktree gets the primary checkout's local, gitignored config
# (.env, .env.local, agent.env, .envrc, *.local.*) copied in: standard
# procedure, so nobody asks the operator to hand-copy them. pre-start rather
# than post-start so the files exist before any project post-start hook (dev
# server, install) wants them. Fail-open (a missing .env must never abort
# worktree creation), never overwrites, prints names only. For worktrees made
# without wt, run the script by hand: worktree-copy-local-env <worktree>.
# The -x guard covers the window between merging this and re-running stow.
[pre-start]
copy-local-env = "[ ! -x ~/bin/worktree-copy-local-env ] || ~/bin/worktree-copy-local-env {{ worktree_path }} {{ primary_worktree_path }}"
