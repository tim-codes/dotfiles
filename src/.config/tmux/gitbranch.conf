# Per-pane git branch chip: a custom catppuccin module, sourced from
# src/.tmux.conf after tpm (it needs the plugin's palette and
# status_module.conf). Its own file because MODULE_NAME has to be %hidden in
# the file that sources status_module.conf - declared in .tmux.conf itself,
# the module is never built.
%hidden MODULE_NAME="gitbranch"
set -gq "@catppuccin_${MODULE_NAME}_icon" " "
set -gqF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_mauve}"
set -gq "@catppuccin_${MODULE_NAME}_text" " #(git -C '#{pane_current_path}' branch --show-current 2>/dev/null)"
source-file -q ~/.tmux/plugins/tmux/utils/status_module.conf
