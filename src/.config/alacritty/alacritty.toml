[general]
# Both imports are machine-local files generated by scripts/init, gitignored (a
# missing import is ignored, and imports merge at lower priority than this
# file, so no machine-specific values may live here):
# - theme.toml is the active-theme indirection, owned and rewritten by althemer
#   (pointed at it via alacritty_config in althemer's config.json); seeded to
#   material_prism
# - local.toml carries per-machine settings (the fish path differs per
#   platform)
import = [
  "~/.config/alacritty/theme.toml",
  "~/.config/alacritty/local.toml",
]

# OSC 52 clipboard writes are disabled per machine on macOS (local.toml, from
# scripts/init) - see docs/adr/2026-10-27-alacritty-clipboard-single-writer.md.
# Don't reach for debug.log_level = "Error" to hide warnings: alacritty takes
# max(config, CLI default Warn), so the config can only raise verbosity.

[font]
size = 15

[font.bold]
family = "GeistMono Nerd Font Mono"
style = "Bold"

[font.bold_italic]
family = "GeistMono Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "GeistMono Nerd Font Mono"
style = "Italic"

[font.normal]
family = "GeistMono Nerd Font Mono"

[window]
# decorations = "none"
dynamic_title = true
dimensions = { columns = 100, lines = 50 }
# Left Option is Alt (tmux's M-hjkl pane resize); right Option still composes
# characters - on the UK layout that's # (Opt+3) and € (Opt+2). The explicit
# Alt+arrow/delete bindings below win over this, so word motions are
# unchanged. macOS-only; ignored elsewhere. Mirrored in the ghostty config.
option_as_alt = "OnlyLeft"

# tmux prefix on Cmd+. : tmux can't see Cmd, so send its real prefix, C-a.
# Chosen over Cmd+\ because 1Password's default global autofill shortcut is
# Cmd+\ (cleared on this machine, but back after a reset). Same binding in
# the ghostty config. Cross-platform as is: on Linux "Command" is Super, so
# Super+. does the same; if the desktop grabs that chord, C-a still works.
[[keyboard.bindings]]
key = "."
mods = "Command"
chars = "\u0001"

# The § key is the tmux key, mirroring the ghostty config: § opens tmux-home
# (C-a .). Like ghostty's literal §, it follows the layout and never fires on
# one without a §.
[[keyboard.bindings]]
key = "§"
chars = "\u0001."

# Opt+\ also opens tmux-home, same as the ghostty config: sends C-a ., and the
# popup closes on the same chord. Left Option only (option_as_alt above).
[[keyboard.bindings]]
key = "\\"
mods = "Alt"
chars = "\u0001."

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

# macOS-style word-wise editing: send the readline/emacs escape sequences so
# fish/zsh/bash treat Opt+arrows and Opt+delete as word motions.
[[keyboard.bindings]]
key = "Left"
mods = "Alt"
chars = "\u001Bb"

[[keyboard.bindings]]
key = "Right"
mods = "Alt"
chars = "\u001Bf"

[[keyboard.bindings]]
key = "Back"
mods = "Alt"
chars = "\u001B\u007F"

[[keyboard.bindings]]
key = "Delete"
mods = "Alt"
chars = "\u001Bd"

# Cmd+Left/Right = Home/End, as in macOS text fields. Sends the Home/End key
# sequences rather than C-a/C-e: C-a is the tmux prefix. Same in the ghostty
# config. On Linux "Command" is Super.
[[keyboard.bindings]]
key = "Left"
mods = "Command"
chars = "\u001B[H"

[[keyboard.bindings]]
key = "Right"
mods = "Command"
chars = "\u001B[F"

# Cmd+Opt+1 ... Cmd+Opt+0 = tmux window 1 ... 10 of the session, the tmux
# counterpart of Cmd+1 ... (alacritty's own tab switching; no default uses
# Cmd+Opt+digit). tmux can't see Cmd, so each sends a function key no app uses,
# Ctrl+Alt+Shift+F1 ... F10 (xterm's CSI 1;8P ... CSI 21;8~), which tmux-home
# binds (@home-switch-keys in .tmux.conf) and its popup reads too. 3 is F12
# (CSI 24;8~), not F3: F3's CSI 1;8R looks like a cursor position report to
# the popup. Same in the ghostty config.
[[keyboard.bindings]]
key = "1"
mods = "Command|Alt"
chars = "\u001B[1;8P"

[[keyboard.bindings]]
key = "2"
mods = "Command|Alt"
chars = "\u001B[1;8Q"

[[keyboard.bindings]]
key = "3"
mods = "Command|Alt"
chars = "\u001B[24;8~"

[[keyboard.bindings]]
key = "4"
mods = "Command|Alt"
chars = "\u001B[1;8S"

[[keyboard.bindings]]
key = "5"
mods = "Command|Alt"
chars = "\u001B[15;8~"

[[keyboard.bindings]]
key = "6"
mods = "Command|Alt"
chars = "\u001B[17;8~"

[[keyboard.bindings]]
key = "7"
mods = "Command|Alt"
chars = "\u001B[18;8~"

[[keyboard.bindings]]
key = "8"
mods = "Command|Alt"
chars = "\u001B[19;8~"

[[keyboard.bindings]]
key = "9"
mods = "Command|Alt"
chars = "\u001B[20;8~"

[[keyboard.bindings]]
key = "0"
mods = "Command|Alt"
chars = "\u001B[21;8~"
