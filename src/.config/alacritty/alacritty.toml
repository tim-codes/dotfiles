[general]
# local.toml carries per-machine settings (the fish path differs per
# platform) - generated by scripts/init, gitignored. A missing import is
# ignored, and imports merge at lower priority than this file, so no
# machine-specific values may live here.
import = [
  "~/.config/alacritty/themes/catppuccin_mocha.toml",
  "~/.config/alacritty/local.toml",
]

[font]
size = 13

[font.bold]
family = "GeistMono Nerd Font Mono"
style = "Bold"

[font.bold_italic]
family = "GeistMono Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "GeistMono Nerd Font Mono"
style = "Italic"

[font.normal]
family = "GeistMono Nerd Font Mono"

[window]
# decorations = "none"
dynamic_title = true
dimensions = { columns = 100, lines = 50 }

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
