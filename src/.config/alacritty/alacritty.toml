[general]
# Both imports are machine-local files generated by scripts/init, gitignored (a
# missing import is ignored, and imports merge at lower priority than this
# file, so no machine-specific values may live here):
# - theme.toml is the active-theme indirection, owned and rewritten by althemer
#   (pointed at it via alacritty_config in althemer's config.json); seeded to
#   material_prism
# - local.toml carries per-machine settings (the fish path differs per
#   platform)
import = [
  "~/.config/alacritty/theme.toml",
  "~/.config/alacritty/local.toml",
]

# Errors only in the message bar (default Warn). Claude Code's copy-on-select
# writes the clipboard several ways at once under tmux - pbcopy, plus OSC 52
# both raw (tmux re-emits it, set-clipboard on) and DCS-passthrough - so
# alacritty's NSPasteboard write occasionally loses the race to pbcopy and
# warns "NSPasteboard#writeObjects: returned false". Harmless: pbcopy already
# put the same text there. Cost: config typo warnings (unused keys) are hidden
# too - run `alacritty -v` to see them. Read at startup only, not live-reloaded.
[debug]
log_level = "Error"

[font]
size = 15

[font.bold]
family = "GeistMono Nerd Font Mono"
style = "Bold"

[font.bold_italic]
family = "GeistMono Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "GeistMono Nerd Font Mono"
style = "Italic"

[font.normal]
family = "GeistMono Nerd Font Mono"

[window]
# decorations = "none"
dynamic_title = true
dimensions = { columns = 100, lines = 50 }
# Left Option is Alt (tmux's M-hjkl pane resize); right Option still composes
# characters - on the UK layout that's # (Opt+3) and € (Opt+2). The explicit
# Alt+arrow/delete bindings below win over this, so word motions are
# unchanged. macOS-only; ignored elsewhere. Mirrored in the ghostty config.
option_as_alt = "OnlyLeft"

# tmux prefix on Cmd+. : tmux can't see Cmd, so send its real prefix, C-a.
# Chosen over Cmd+\ because 1Password's default global autofill shortcut is
# Cmd+\ (cleared on this machine, but back after a reset). Same binding in
# the ghostty config. Cross-platform as is: on Linux "Command" is Super, so
# Super+. does the same; if the desktop grabs that chord, C-a still works.
[[keyboard.bindings]]
key = "."
mods = "Command"
chars = "\u0001"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

# macOS-style word-wise editing: send the readline/emacs escape sequences so
# fish/zsh/bash treat Opt+arrows and Opt+delete as word motions.
[[keyboard.bindings]]
key = "Left"
mods = "Alt"
chars = "\u001Bb"

[[keyboard.bindings]]
key = "Right"
mods = "Alt"
chars = "\u001Bf"

[[keyboard.bindings]]
key = "Back"
mods = "Alt"
chars = "\u001B\u007F"

[[keyboard.bindings]]
key = "Delete"
mods = "Alt"
chars = "\u001Bd"

# Cmd+Left/Right = Home/End, as in macOS text fields. Sends the Home/End key
# sequences rather than C-a/C-e: C-a is the tmux prefix. Same in the ghostty
# config. On Linux "Command" is Super.
[[keyboard.bindings]]
key = "Left"
mods = "Command"
chars = "\u001B[H"

[[keyboard.bindings]]
key = "Right"
mods = "Command"
chars = "\u001B[F"
