[general]
# Both imports are machine-local files generated by scripts/init (a missing
# import is ignored, and imports merge at lower priority than this file, so no
# machine-specific values may live here):
# - the Application Support file is the active-theme indirection, owned and
#   rewritten by althemer (which hardcodes that path on mac); seeded to
#   catppuccin_mocha
# - local.toml carries per-machine settings (the fish path differs per
#   platform)
import = [
  "~/Library/Application Support/alacritty/alacritty.toml",
  "~/.config/alacritty/local.toml",
]

[font]
size = 13

[font.bold]
family = "GeistMono Nerd Font Mono"
style = "Bold"

[font.bold_italic]
family = "GeistMono Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "GeistMono Nerd Font Mono"
style = "Italic"

[font.normal]
family = "GeistMono Nerd Font Mono"

[window]
# decorations = "none"
dynamic_title = true
dimensions = { columns = 100, lines = 50 }

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

# macOS-style word-wise editing: send the readline/emacs escape sequences so
# fish/zsh/bash treat Opt+arrows and Opt+delete as word motions.
[[keyboard.bindings]]
key = "Left"
mods = "Alt"
chars = "\u001Bb"

[[keyboard.bindings]]
key = "Right"
mods = "Alt"
chars = "\u001Bf"

[[keyboard.bindings]]
key = "Back"
mods = "Alt"
chars = "\u001B\u007F"

[[keyboard.bindings]]
key = "Delete"
mods = "Alt"
chars = "\u001Bd"
