# squad (~/dev/squad): accounts the quota watcher tracks and the broker maps
# sessions onto. Everything else is the built-in default; see the repo's
# config.example.toml for the knobs.

[broker]
# Deny overlay merged into every member launch's --settings (permissions.deny: the
# gh pr merge block and the secret-read floor). Members run in auto permission mode;
# deny rules are checked before the mode, so these always hold.
member_settings = "~/.config/squad/member-settings.json"

# PATH the broker launches members with (replaces the built-in default). The default
# list plus the pnpm global bin dir, where the playwright-mcp shim lives. Applies at
# the next broker restart. The node entry is the mise Node 24 major symlink, stable across
# patch upgrades.
launch_path = ["~/.cargo/bin", "~/.local/bin", "~/Library/pnpm/bin", "~/.local/share/mise/installs/node/24/bin", "~/.orbstack/bin", "/opt/homebrew/bin", "/usr/local/bin", "/usr/bin", "/bin", "/usr/sbin", "/sbin"]

# Personal and exxo-personal are the same account; listing both dirs lets the
# watcher dedupe their caches. The first dir is the one whose keychain token
# the API tier reads.
[[accounts]]
name = "personal"
# provides: capabilities this pool can satisfy; placement needs provides ⊇ task needs
#   (empty means the pool can never be placed).
# placement_rank: lower is preferred (reserve first, then exxo, then personal).
# reserve_pct: floor kept back for Tim's own use (squad v0.5 P4 decision).
# playwright/browser are capabilities for placement; only playwright has an MCP server the orchestrator passes to member launches that need it ([policy.launch] needs_mcp)
# 1password: agent/run resolves 1Password references on this host in every context, so every account provides it; vercel: the Vercel MCP server is exxo-only, so only exxo provides it
provides = ["docker", "rust", "shell", "node", "postgres", "playwright", "browser", "1password", "boards"]
placement_rank = 30
reserve_pct = 10
email = "timoconnell1024@gmail.com"
config_dirs = ["~/.claude-personal", "~/.claude-exxo-personal"]

# Second personal Max subscription (5x): a separate login with its own state,
# so its own account and quota.
[[accounts]]
name = "reserve"
provides = ["docker", "rust", "shell", "node", "postgres", "playwright", "browser", "1password", "boards"]
placement_rank = 10
reserve_pct = 0
email = "tim.oc@outlook.com"
config_dirs = ["~/.claude-reserve"]

[[accounts]]
name = "exxo"
provides = ["docker", "rust", "shell", "node", "postgres", "playwright", "browser", "1password", "vercel", "boards"]
placement_rank = 20
reserve_pct = 30
email = "tim@exxo.io"
config_dirs = ["~/.claude-exxo"]

[[accounts]]
name = "openrouter"
kind = "metered"
provider = "openrouter"
key_file = "~/keys/openrouter.key"

[quota]
levels = [50, 75, 85, 90, 95, 100]
projection_horizon_minutes = 60

[policy.launch]
# Squad-owned verification (R20): task branches the squad creates are gaia/task-<member>.
# Applies only to repos whose trunk policy is `trunk`; `direct` repos keep squad/<member> lanes.
branch_prefix = "gaia/task-"
# Replaces the built-in needs_mcp. `browser` has no server on purpose: the Chrome
# integration (claude-in-chrome) is a Claude Code settings flag, not an mcpServers entry.
# `browser` still gates placement through `provides`.
needs_mcp = { playwright = "playwright", boards = "boards" }
# Up to ten live members while unattended (Tim, 2026-10-31: use up to 80-90% of the host).
max_live_members = 10

[host]
# Unattended operation may use up to 80-90% of CPU and memory (Tim, 2026-10-31); warn only above that.
cpu_warn = 90
cpu_critical = 97

# Apps whose interactive performance the orchestrator protects: while one is
# running, pressure thresholds drop to the protected_* values and heavy work pauses.
protected = ["Astris"]
protected_cpu_warn = 60
protected_cpu_critical = 80

# Processes outside any member's tree that stay hot or bloated get a host.runaway event
runaway_cpu = 100.0
runaway_rss_mb = 4096
runaway_minutes = 2

# Expected watchers: `squad doctor` reports one that has gone silent.
[[watchers]]
name = "quota"
[[watchers]]
name = "host"

[policy.heavy]
# Slots are derived from live host headroom (Tim, 2026-10-30). The one-minute load average on this
# 12-core host overstates CPU use while many idle sessions exist, so per-slot CPU and the reserved
# headroom are set low enough that measured CPU, not load, decides (code fix tracked in squad).
cpu_per_slot_pct = 10
min_headroom_pct = 8
mem_per_slot_mb = 3072
# Cap raised from the default floor(cores/4)=3 so the host can run at 80-90% while unattended (Tim, 2026-10-31).
max_slots = 6

[heavy]
# heavy_slot_min_calm_s is omitted so the built-in 300 s dwell applies: the broker's calm-dwell gate now follows live CPU/memory headroom (squad #257, live from v0.5.11 on 2026-11-02).
# The 20 s workaround of October is no longer needed.

[orchestrator]
# Stable URL of the 7780 GUI tunnel (BFF, v0.6.0; was 7790) that src/bin/squad-tunnel hosts (persistent dev tunnel
# exxo-tfo-squad; the hostname survives restarts, and only changes if the tunnel is deleted and
# recreated, when this must be updated from `squad-tunnel url`). Takes effect at the next orchestrator restart.
public_url = "https://j9fsc30w-7780.uks1.devtunnels.ms"

[policy.trunk]
# Squad-owned verification (R20): trunk branches are gaia/trunk-<name>.
branch_prefix = "gaia/trunk-"
review_timeout_s = 1800                     # raised from 900 on 2026-11-03: portal land reviews that run the gate take 10-20 min (4 operator holds)
# Appended to each squash-merge body after the PR body.
trailers = ["Co-Authored-By: Claude <noreply@anthropic.com>"]

[policy.preview]
# Run once per member when a task is done or its land is finally refused (execFile, no shell, so an
# absolute path). Tears down the lane previews the member owns.
teardown = ["just", "-f", "/Users/tim/dev/squad/deploy/Justfile", "preview-prune", "{member}"]

[exclusions]
# Every present and future h2gc production stack needs Tim's approval (Tim, 2026-11-03).
# Intent only in v0.5.15: nothing enforces it at land time yet (ENG-536); exxo-infra stays unregistered.
approval_stack_patterns = ["exxo/h2gc*/*prod*"]

# Project data access (R18). Tim's baseline: rows for ceiling deliverables.
[[policy.data_access.rule]]
repo = "Exxo-Labs/h2gc-portal"
env = "staging"
dataset = "ario_usage_events"
effect = "allow"
note = "Tim, 4 Nov 2026: usage rows for ceiling deliverables (#354)"

# Per-context Chrome for the squad's browser sign-ins (R19). Launch with `chrome-squad <context>`
# (src/.config/fish/functions/chrome-squad.fish); the cdp_url must stay loopback.
[browser.contexts.reserve]
user_data_dir = "~/Library/Application Support/Google/Chrome-Squad-reserve"
cdp_url = "http://127.0.0.1:9231"

[browser.contexts.exxo]
user_data_dir = "~/Library/Application Support/Google/Chrome-Squad-exxo"
cdp_url = "http://127.0.0.1:9232"

[browser.contexts.personal]
user_data_dir = "~/Library/Application Support/Google/Chrome-Squad-personal"
cdp_url = "http://127.0.0.1:9233"

[auth]
# The squad's own manifest of login credential names (SQUAD_LOGIN_<SITE>_USER=1p:<vault>/<item>:username
# and so on, plus EXXO_1P_ACCOUNT). References only, never real item ids in a repo.
agent_env = "~/.config/squad/agent.env"

# Squad-owned verification on buildlab (R20). The key file is a path reference; its content is never in this repo.
[broker.buildlab]
credentials_file = "~/.config/squad/gaia-broker.json"
machine_cpu = 16
machine_mem_gi = 64
max_nodes = 2
min_nodes = 0
warm_idle_s = 1200
scale_ahead = true
[policy.operator]
plan_review_timeout_s = 1800               # raised from 900 on 2026-11-03, same reason as review_timeout_s

[policy.release]
verify_timeout_s = 3600                    # raised from 1800 on 2026-11-03: the staging verifier runs e2e + smoke and gave no report in 1800 s
