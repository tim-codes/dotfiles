# squad (~/dev/squad): accounts the quota watcher tracks and the broker maps
# sessions onto. Everything else is the built-in default; see the repo's
# config.example.toml for the knobs. Why these values: tim-codes/squad
# docs/runbooks/deployment-profile.md (dated decisions live there).

[broker]
# Deny overlay merged into every member launch's --settings (permissions.deny: the
# gh pr merge block and the secret-read floor). Members run in auto permission mode;
# deny rules are checked before the mode, so these always hold.
member_settings = "~/.config/squad/member-settings.json"

# PATH the broker launches members with (replaces the built-in default). The default
# list plus the pnpm global bin dir, where the playwright-mcp shim lives. Applies at
# the next broker restart. The node entry is the mise Node 24 major symlink, stable across
# patch upgrades.
launch_path = ["~/.cargo/bin", "~/.local/bin", "~/Library/pnpm/bin", "~/.local/share/mise/installs/node/24/bin", "~/.orbstack/bin", "/opt/homebrew/bin", "/usr/local/bin", "/usr/bin", "/bin", "/usr/sbin", "/sbin"]

# Personal and exxo-personal are the same account; listing both dirs lets the
# watcher dedupe their caches. The first dir is the one whose keychain token
# the API tier reads.
[[accounts]]
name = "personal"
# provides: capabilities this pool can satisfy; placement needs provides ⊇ task needs
#   (empty means the pool can never be placed).
# placement_rank: lower is preferred (reserve first, then exxo, then personal).
# reserve_pct: floor kept back for Tim's own use (squad v0.5 P4 decision).
# playwright/browser are capabilities for placement; only playwright has an MCP server the orchestrator passes to member launches that need it ([policy.launch] needs_mcp)
# 1password: agent/run resolves 1Password references on this host in every context, so every account provides it; vercel: the Vercel MCP server is exxo-only, so only exxo provides it
# Test round (Tim, 7 Nov 2026, hand-over 7): out of placement, kept defined so it is reversible.
# Restore: provides = ["docker", "rust", "shell", "node", "postgres", "playwright", "browser", "1password", "boards"], placement_rank = 30.
provides = []
placement_rank = 99
reserve_pct = 10
email = "timoconnell1024@gmail.com"
config_dirs = ["~/.claude-personal", "~/.claude-exxo-personal"]

# Second personal Max subscription (5x): a separate login with its own state,
# so its own account and quota.
[[accounts]]
name = "reserve"
# Test round: out of placement, kept defined so it is reversible.
# Restore: provides = ["docker", "rust", "shell", "node", "postgres", "playwright", "browser", "1password", "boards"], placement_rank = 10.
provides = []
placement_rank = 99
reserve_pct = 0
email = "tim.oc@outlook.com"
config_dirs = ["~/.claude-reserve"]

[[accounts]]
name = "exxo"
provides = ["docker", "rust", "shell", "node", "postgres", "playwright", "browser", "1password", "vercel", "boards"]
placement_rank = 20
reserve_pct = 30
email = "tim@exxo.io"
config_dirs = ["~/.claude-exxo"]

[[accounts]]
name = "openrouter"
kind = "metered"
provider = "openrouter"
key_file = "~/keys/openrouter.key"
# The metered share places a launch here only when the pool has a config dir and provides the task's needs
# (placement.ts placeMetered). browser, playwright and vercel are left out on purpose: those tasks are excluded by exclude_needs / not placed here.
config_dirs = ["~/.claude-exxo-openrouter"]
provides = ["agent-run", "docker", "rust", "shell", "node", "postgres", "1password", "boards"]
# $75 for the test round, squad-side cap only (no key limit). "month" not "round": a round cap re-arms on every squad.resumed.
budget_usd = 75
budget_period = "month"

[quota]
levels = [50, 75, 85, 90, 95, 100]
projection_horizon_minutes = 60

[policy.launch.metered_share]
# Some member launches on the metered OpenRouter account (DeepSeek), to compare outcomes per account.
# Raise pct towards 50 for a heavier share (hand-over 7).
account = "openrouter"
pct = 25
kinds = ["member"]
exclude_needs = ["browser", "heavy"]

[policy.launch]
# Squad-owned verification (R20): task branches the squad creates are gaia/task-<member>.
# Applies only to repos whose trunk policy is `trunk`; `direct` repos keep squad/<member> lanes.
branch_prefix = "gaia/task-"
# Replaces the built-in needs_mcp. `browser` has no server on purpose: the Chrome
# integration (claude-in-chrome) is a Claude Code settings flag, not an mcpServers entry.
# `browser` still gates placement through `provides`.
needs_mcp = { playwright = "playwright", boards = "boards" }
# Ten live members while unattended (Tim, 2026-10-31).
max_live_members = 10

[host]
# Warn only above 80-90% (Tim, 2026-10-31).
cpu_warn = 90
cpu_critical = 97

# Apps whose interactive performance the orchestrator protects: while one is
# running, pressure thresholds drop to the protected_* values and heavy work pauses.
protected = ["Astris"]
protected_cpu_warn = 60
protected_cpu_critical = 80

# Processes outside any member's tree that stay hot or bloated get a host.runaway event
runaway_cpu = 100.0
runaway_rss_mb = 4096
runaway_minutes = 2

# Expected watchers: `squad doctor` reports one that has gone silent.
[[watchers]]
name = "quota"
[[watchers]]
name = "host"

[policy.heavy]
# Slots derive from live host headroom; low per-slot CPU so measured CPU, not load, decides (Tim, 2026-10-30).
cpu_per_slot_pct = 10
min_headroom_pct = 8
mem_per_slot_mb = 3072
# Raised from the default 3 (Tim, 2026-10-31).
max_slots = 6
# Disabled until [broker.buildlab] and [policy.verification] are on (hand-over 7a); then uncomment.
# offload_to = "buildlab"

[heavy]
# heavy_slot_min_calm_s omitted: the built-in 300 s dwell applies (squad #257, v0.5.11).

[orchestrator]
# Stable URL of the 7780 GUI tunnel (squad docs/runbooks/tunnel.md); update from `squad-tunnel url` if the tunnel is recreated.
public_url = "https://j9fsc30w-7780.uks1.devtunnels.ms"

[policy.trunk]
# Squad-owned verification (R20): trunk branches are gaia/trunk-<name>.
branch_prefix = "gaia/trunk-"
review_timeout_s = 1800                     # was 900; raised 2026-11-03 (portal land reviews take 10-20 min)
# Appended to each squash-merge body after the PR body.
trailers = ["Co-Authored-By: Claude <noreply@anthropic.com>"]

# The squad-tfo GitHub App (hand-over 3): every GitHub call of the orchestrator runs as it.
# key_env is the NAME of the variable holding the key file's PATH; it is read from deploy/.env in the squad
# checkout (exported by the launchd wrapper), never from this repo. The key itself stays in 1Password.
[policy.trunk.github_app]
# gaia-tfo: Exxo-Labs-owned App (created 2026-11-10; replaces the tim-codes-owned squad-tfo),
# installed on Exxo-Labs, all repositories. Its key lives in ESC exxo/gaia/main gaia.githubApp.*;
# the broker host copy is ~/.local/state/squad/keys/gaia-tfo.pem (0600), named by key_env.
app_id = 5704284
installation_ids = { "Exxo-Labs" = 180689949 }
key_env = "GAIA_GITHUB_APP_KEY_FILE"

[policy.preview]
# Run once per member when a task is done or its land is finally refused (execFile, no shell, so an
# absolute path). Tears down the lane previews the member owns.
teardown = ["just", "-f", "/Users/tim/dev/squad/deploy/Justfile", "preview-prune", "{member}"]

[exclusions]
# h2gc production stacks need Tim's approval (2026-11-03); intent only, not yet enforced (ENG-536).
approval_stack_patterns = ["exxo/h2gc*/*prod*"]

# Project data access (R18). Tim's baseline: rows for ceiling deliverables.
[[policy.data_access.rule]]
repo = "Exxo-Labs/h2gc-portal"
env = "staging"
dataset = "ario_usage_events"
effect = "allow"
note = "Tim, 4 Nov 2026: usage rows for ceiling deliverables (#354)"

# Per-context Chrome for the squad's browser sign-ins (R19). Launch with `chrome-squad <context>`
# (src/.config/fish/functions/chrome-squad.fish); the cdp_url must stay loopback.
[browser.contexts.reserve]
user_data_dir = "~/Library/Application Support/Google/Chrome-Squad-reserve"
cdp_url = "http://127.0.0.1:9231"

[browser.contexts.exxo]
user_data_dir = "~/Library/Application Support/Google/Chrome-Squad-exxo"
cdp_url = "http://127.0.0.1:9232"

[browser.contexts.personal]
user_data_dir = "~/Library/Application Support/Google/Chrome-Squad-personal"
cdp_url = "http://127.0.0.1:9233"

[auth]
# The squad's own manifest of login credential names (SQUAD_LOGIN_<SITE>_USER=1p:<vault>/<item>:username
# and so on, plus EXXO_1P_ACCOUNT). References only, never real item ids in a repo.
agent_env = "~/.config/squad/agent.env"

# Squad-owned verification on buildlab (R20). DISABLED for the test round until the attended buildlab-setup
# step has printed the endpoint and written the CA (hand-over 4). The key file is outside this repo; its content is never here.
[broker.buildlab]
enabled = false
credentials_file = "~/.local/state/squad/keys/gaia-broker.json"
# Needed when enabled = true (`just -f deploy/ops.Justfile buildlab-setup` prints/writes them):
# server = "https://<endpoint>"
# ca_file = "~/.local/state/squad/keys/buildlab-ca.pem"
image = "europe-west2-docker.pkg.dev/exxo-internal/gaia/gaia-verify@sha256:0962fbda257aa3897f400969649505ef6f2abb097e1d38c976a14888ac08eb73"  # tag mise-2026.11.1-7d46580; pinned by digest
machine_cpu = 16
machine_mem_gi = 64
max_nodes = 2
min_nodes = 0
warm_idle_s = 1200
scale_ahead = true

# Disabled until [broker.buildlab] is on and doctor passes (hand-over 4 step 3); needs [policy.trunk.github_app].
[policy.verification]
enabled = false

[policy.operator]
plan_review_timeout_s = 1800               # was 900; raised 2026-11-03, as review_timeout_s

[policy.release]
verify_timeout_s = 3600                    # was 1800; raised 2026-11-03 (staging e2e + smoke)

# Builder supervision (a stalled working member is nudged, then escalated); the example's defaults.
# deploy/leader-watch.sh reads idle_nudge_s and recheck_s from here. The leader session (squad-leader, exxo context, fable,
# failsafe only) is the push target, set with `just -f deploy/ops.Justfile leader-watch-start <target>`, not in this file.
[policy.supervision]
enabled = true
idle_nudge_s = 600
silent_nudge_s = 1200
recheck_s = 600
max_nudges = 2
background_wait_max_s = 3600

# Orchestrator kit calls on Tim's personal API credits, falling back to OpenRouter at prefer_fallback_at_pct of the month's spend.
[budget]
# TODO(tim): anthropic_monthly_usd = <the credit you allow>
prefer_fallback_at_pct = 90
provider = "anthropic"
fallback = "openrouter"

[kit]
[[kit.providers]]
name = "anthropic"
kind = "anthropic"
key_file = "~/.local/state/squad/keys/anthropic.key"

[[kit.providers]]
name = "openrouter"
kind = "openrouter"
key_file = "~/.local/state/squad/keys/openrouter.key"
model = "deepseek/deepseek-v4.1-flash-1017@preset/tim-ds"
