# squad (~/dev/squad): accounts the quota watcher tracks and the broker maps
# sessions onto. Everything else is the built-in default; see the repo's
# config.example.toml for the knobs. Why these values: tim-codes/squad
# docs/runbooks/deployment-profile.md (dated decisions live there).

[broker]
# Deny overlay merged into every member launch's --settings (permissions.deny: the
# gh pr merge block and the secret-read floor). Members run in auto permission mode;
# deny rules are checked before the mode, so these always hold.
member_settings = "~/.config/squad/member-settings.json"

# PATH the broker launches members with (replaces the built-in default). The default
# list plus the pnpm global bin dir, where the playwright-mcp shim lives. Applies at
# the next broker restart. The node entry is the mise Node 24 major symlink, stable across
# patch upgrades.
launch_path = ["~/.cargo/bin", "~/.local/bin", "~/Library/pnpm/bin", "~/.local/share/mise/installs/node/24/bin", "~/.orbstack/bin", "/opt/homebrew/bin", "/usr/local/bin", "/usr/bin", "/bin", "/usr/sbin", "/sbin"]

# Personal and exxo-personal are the same account; listing both dirs lets the
# watcher dedupe their caches. The first dir is the one whose keychain token
# the API tier reads.
[[accounts]]
name = "personal"
# provides: capabilities this pool can satisfy; placement needs provides ⊇ task needs
#   (empty means the pool can never be placed).
# placement_rank: lower is preferred (reserve, then personal, then exxo last; Tim 16 Nov 2026).
# The quota reserve (floor kept back for Tim's own use) is a runtime directive from Gaia v0.6.1
# (quota_reserve @ account:<name>; squad docs/runbooks/budgets.md), not a config key.
# playwright/browser are capabilities for placement; only playwright has an MCP server the orchestrator passes to member launches that need it ([policy.launch] needs_mcp)
# 1password: agent/run resolves 1Password references on this host in every context, so every account provides it; vercel: the Vercel MCP server is exxo-only, so only exxo provides it
# Tim, 16 Nov 2026: back in placement. Policy: most Gaia work goes to the personal/reserve Ultra plans;
# exxo is used only where a task needs an org-scope capability (vercel) or the others are full.
provides = ["docker", "rust", "shell", "node", "postgres", "playwright", "browser", "1password", "boards"]
placement_rank = 20
email = "timoconnell1024@gmail.com"
config_dirs = ["~/.claude-personal", "~/.claude-exxo-personal"]

# Second personal Max subscription (5x): a separate login with its own state,
# so its own account and quota.
[[accounts]]
name = "reserve"
# Tim, 16 Nov 2026: back in placement (see personal).
provides = ["docker", "rust", "shell", "node", "postgres", "playwright", "browser", "1password", "boards"]
placement_rank = 10
email = "tim.oc@outlook.com"
config_dirs = ["~/.claude-reserve"]

[[accounts]]
name = "exxo"
provides = ["docker", "rust", "shell", "node", "postgres", "playwright", "browser", "1password", "vercel", "boards"]
# Tim, 16 Nov 2026: exxo is last choice by policy (org-scope needs such as vercel, or overflow).
placement_rank = 90
email = "tim@exxo.io"
config_dirs = ["~/.claude-exxo"]

[[accounts]]
name = "openrouter"
kind = "metered"
provider = "openrouter"
key_file = "~/keys/openrouter.key"
# The metered share places a launch here only when the pool has a config dir and provides the task's needs
# (placement.ts placeMetered). browser, playwright and vercel are left out on purpose: those tasks are excluded by exclude_needs / not placed here.
config_dirs = ["~/.claude-exxo-openrouter"]
provides = ["docker", "rust", "shell", "node", "postgres", "boards"]
# v0.7.0 (ENG-663): repricing at the tim-ds preset's first provider (DeepInfra fp8, read 13 Nov 2026; USD per Mtok)
# and the per-session cost guard (Tim 13 Nov: pause $6, warn item $3).
pricing = { input = 0.098, output = 0.294, cache_read = 0.0029, cache_write = 0 }
session_cost_pause_usd = 6
session_cost_item_usd = 3
# The spend cap is a runtime directive from Gaia v0.6.1 (spend_cap @ account:openrouter: $75/month for the test round).

[quota]
levels = [50, 75, 85, 90, 95, 100]
projection_horizon_minutes = 60

[policy.launch.metered_share]
# Some member launches on the metered OpenRouter account (DeepSeek), to compare outcomes per account.
# The account and share are a runtime directive from Gaia v0.6.1 (metered_share @ squad: openrouter, 25 %).
kinds = ["member"]
exclude_needs = ["browser", "heavy"]

[policy.launch]
# Lane branches the squad creates are gaia/task-<member> in every repo, whatever its trunk
# policy or ci mode (ENG-620: squad/<member> lanes are retired). Also the schema default.
branch_prefix = "gaia/task-"
# Replaces the built-in needs_mcp. `browser` has no server on purpose: the Chrome
# integration (claude-in-chrome) is a Claude Code settings flag, not an mcpServers entry.
# `browser` still gates placement through `provides`.
needs_mcp = { playwright = "playwright", boards = "boards" }
# Ten live members while unattended (Tim, 2026-10-31).
max_live_members = 10

[host]
# Warn only above 80-90% (Tim, 2026-10-31).
cpu_warn = 90
cpu_critical = 97

# Apps whose interactive performance the orchestrator protects: while one is
# running, pressure thresholds drop to the protected_* values and heavy work pauses.
protected = ["Astris"]
protected_cpu_warn = 60
protected_cpu_critical = 80

# Processes outside any member's tree that stay hot or bloated get a host.runaway event
runaway_cpu = 100.0
runaway_rss_mb = 4096
runaway_minutes = 2

# Expected watchers: `squad doctor` reports one that has gone silent.
[[watchers]]
name = "quota"
[[watchers]]
name = "host"
# The buildlab gauge, which also drives every run and the gaia pool scaler (R20).
[[watchers]]
name = "buildlab"

[policy.heavy]
# Slots derive from live host headroom; low per-slot CPU so measured CPU, not load, decides (Tim, 2026-10-30).
cpu_per_slot_pct = 10
min_headroom_pct = 8
mem_per_slot_mb = 3072
# Raised from the default 3 (Tim, 2026-10-31).
max_slots = 6
# Heavy work naming a verify-manifest suite goes to buildlab (Gaia v0.6.1 rollout C5, 2026-11-11).
offload_to = "buildlab"

[policy.heavy.host_pressure]
# v0.7.2 (ENG-685): swap_used_frac removed (macOS swap latches, which kept t129 paused on 15 Nov); the hot rule
# reads the memory-pressure level, mem_pressure_at default "warn". Other keys are the documented defaults.
load_per_core = 3.0
min_free_mb = 2048
hot_for_s = 120
throttle = true
throttle_after_s = 180
throttle_step_s = 120
throttle_min_running = 2
release_after_s = 300

[heavy]
# heavy_slot_min_calm_s omitted: the built-in 300 s dwell applies (squad #257, v0.5.11).

[orchestrator]
# Stable URL of the 7780 GUI tunnel (squad docs/runbooks/tunnel.md); update from `squad-tunnel url` if the tunnel is recreated.
public_url = "https://j9fsc30w-7780.uks1.devtunnels.ms"

[policy.trunk]
# Squad-owned verification (R20): trunk branches are gaia/trunk-<name>.
branch_prefix = "gaia/trunk-"
review_timeout_s = 1800                     # was 900; raised 2026-11-03 (portal land reviews take 10-20 min)
# Appended to each squash-merge body after the PR body.
trailers = ["Co-Authored-By: Claude <noreply@anthropic.com>"]

# The squad-tfo GitHub App (hand-over 3): every GitHub call of the orchestrator runs as it.
# key_env is the NAME of the variable holding the key file's PATH; it is read from deploy/.env in the squad
# checkout (exported by the launchd wrapper), never from this repo. The key itself stays in 1Password.
[policy.trunk.github_app]
# gaia-tfo: Exxo-Labs-owned App (created 2026-11-10; replaces the tim-codes-owned squad-tfo),
# installed on Exxo-Labs, all repositories. Its key lives in ESC exxo/gaia/main gaia.githubApp.*;
# the broker host copy is ~/.local/state/squad/keys/gaia-tfo.pem (0600), named by key_env.
app_id = 5704284
installation_ids = { "Exxo-Labs" = 180689949 }
key_env = "GAIA_GITHUB_APP_KEY_FILE"

[policy.members]
# v0.7.0 (ENG-642): the classic read:packages PAT for member pnpm installs, read from the secret cache only.
packages_token_ref = "esc:exxo/gaia/tfo:github.packagesToken"

[policy.preview]
# Run once per member when a task is done or its land is finally refused (execFile, no shell, so an
# absolute path). Tears down the lane previews the member owns.
teardown = ["just", "-f", "/Users/tim/dev/squad/deploy/Justfile", "preview-prune", "{member}"]

[policy.risk_review]
# v0.7.2 (lane K): replaces [exclusions] approval_stack_patterns. Unions with the code floor (the h2gc prod stacks);
# the glob keeps the 3 Nov intent for any further h2gc prod stack.
production_stacks = ["exxo/h2gc*/*prod*"]

# Project data access (R18). Tim's baseline: rows for ceiling deliverables.
[[policy.data_access.rule]]
repo = "Exxo-Labs/h2gc-portal"
env = "staging"
dataset = "ario_usage_events"
effect = "allow"
note = "Tim, 4 Nov 2026: usage rows for ceiling deliverables (#354)"

# Per-context Chrome for the squad's browser sign-ins (R19). Launch with `chrome-squad <context>`
# (src/.config/fish/functions/chrome-squad.fish); the cdp_url must stay loopback.
[browser.contexts.reserve]
user_data_dir = "~/Library/Application Support/Google/Chrome-Squad-reserve"
cdp_url = "http://127.0.0.1:9231"

[browser.contexts.exxo]
user_data_dir = "~/Library/Application Support/Google/Chrome-Squad-exxo"
cdp_url = "http://127.0.0.1:9232"

[browser.contexts.personal]
user_data_dir = "~/Library/Application Support/Google/Chrome-Squad-personal"
cdp_url = "http://127.0.0.1:9233"

[auth]
# The squad's own manifest of login credential names (SQUAD_LOGIN_<SITE>_USER=1p:<vault>/<item>:username
# and so on, plus EXXO_1P_ACCOUNT). References only, never real item ids in a repo.
agent_env = "~/.config/squad/agent.env"

# Squad-owned verification on buildlab (R20). Enabled in the Gaia v0.6.1 rollout (C5, 2026-11-11).
# server is the ci-runners endpoint `just -f deploy/ops.Justfile buildlab-setup` prints; ca_file is the cluster's
# public CA it writes (moved beside the keys, outside this repo). The key file's content is never here.
[broker.buildlab]
enabled = true
server = "https://34.142.89.133"
ca_file = "~/.local/state/squad/keys/buildlab-ca.pem"
credentials_file = "~/.local/state/squad/keys/gaia-broker.json"
# The Homebrew cask keeps the plugin in the SDK's bin dir, which is not on [broker] launch_path.
auth_plugin = "/opt/homebrew/share/google-cloud-sdk/bin/gke-gcloud-auth-plugin"
image = "europe-west2-docker.pkg.dev/exxo-internal/gaia/gaia-verify@sha256:77dc784e7fa1af85c48c26244cc9f85809ca2bc2317ab32a07864532335e5a3c"  # tag mise-2026.11.1-3712bba; pinned by digest
machine_cpu = 16
machine_mem_gi = 64
max_nodes = 3                      # Tim 15 Nov: within exxo-internal's CPU quota once exxo-infra#286 (heavy 6→4, small 4→3 nodes) applies: pools at max = 178 of 200 vCPU
max_cpu_m = 43500  # 3 nodes x ~14.5 cores allocatable (2 nodes admitted 29000); an h2gc-portal verify needs 33000
min_nodes = 0
warm_idle_s = 1200
scale_ahead = true

# On with [broker.buildlab] (Gaia v0.6.1 rollout C5); needs [policy.trunk.github_app].
[policy.verification]
enabled = true

[policy.operator]
plan_review_timeout_s = 1800               # was 900; raised 2026-11-03, as review_timeout_s

[policy.release]
verify_timeout_s = 3600                    # was 1800; raised 2026-11-03 (staging e2e + smoke)

# Builder supervision (a stalled working member is nudged, then escalated); the example's defaults.
# deploy/leader-watch.sh reads idle_nudge_s and recheck_s from here. The leader session (squad-leader, exxo context, fable,
# failsafe only) is the push target, set with `just -f deploy/ops.Justfile leader-watch-start <target>`, not in this file.
[policy.supervision]
enabled = true
idle_nudge_s = 600
silent_nudge_s = 1200
recheck_s = 600
max_nudges = 2
background_wait_max_s = 3600

# Kit calls go to the providers below in order. Their caps are runtime directives from Gaia v0.6.1
# (spend_cap @ provider:<name>, kit_token_cap @ kit:<role>), not config keys.
[kit]
# Anthropic keys (15 Nov 2026): Console service-account keys gaia-tfo-<plan> in workspace gaia-tfo, one org per Ultra plan
# (its $200/month API credits). Source of truth is ESC exxo/gaia/tfo; refill a file with
# `just -f deploy/ops.Justfile provider-key-sync esc:exxo/gaia/tfo:anthropic.<plan>.apiKey <key_file>`, then restart.
[[kit.providers]]
name = "anthropic"                 # personal Ultra plan: anthropic.personal.apiKey
kind = "anthropic"
key_file = "~/.local/state/squad/keys/anthropic.key"

[[kit.providers]]
name = "anthropic-reserve"         # reserve Ultra plan: anthropic.reserve.apiKey; used once anthropic fails or is capped
kind = "anthropic"
key_file = "~/.local/state/squad/keys/anthropic-reserve.key"

[[kit.providers]]
name = "openrouter"
kind = "openrouter"
key_file = "~/.local/state/squad/keys/openrouter.key"
model = "deepseek/deepseek-v4.1-flash-1017@preset/tim-ds"

# v0.7.0: the arbiter, on for the next test round (Tim 13 Nov). Cap: kit_token_cap @ kit:arbiter (1.5M tokens/day since 15 Nov, both Ultra plans' API credits;
# provider spend caps $200/month each). Model and limits are the defaults (sonnet). To switch off: enabled = false, restart.
[policy.arbiter]
enabled = true
[policy.arbiter.classes.triage]
verdicts = ["retry", "reroute", "escalate", "ignore", "close", "wait"]
[policy.arbiter.classes.refusal_review]
verdicts = ["auto_close", "refuse", "escalate"]
[policy.arbiter.classes.relaunch_or_abandon]
verdicts = ["relaunch", "abandon", "escalate"]
[policy.arbiter.classes.question]
verdicts = ["answered"]
[policy.arbiter.classes.deliverables_audit]
verdicts = ["complete", "incomplete", "descope", "amend", "accept_with_followup", "unverifiable"]
# v0.7.2: stall_review (ENG-686; resume is G12, approved 16 Nov) and infra_risk (lane K, full-auto infra 16 Nov).
[policy.arbiter.classes.stall_review]
verdicts = ["resume", "nudge", "relaunch", "rerun_verify", "wait", "escalate"]
[policy.arbiter.classes.infra_risk]
verdicts = ["merge", "revise", "escalate"]

[policy.self_release]
# v0.7.2: needed by G1/G2 (the idle restart goes through dev.tim.squad-release). Gaia never lands on gaia main
# (Gaia fixes are built by subagents), so only the idle-restart path uses it.
enabled = true
repo = "Exxo-Labs/gaia"

[policy.grants]
# Tim, 16 Nov 2026: "turn on all the new grants". The five built grants are on; the rest are not built
# yet (docs/runbooks/grants.md) and stay false until they are. Each key is its kill switch (hot reload).
restart_broker_when_idle = true            # G1
restart_orchestrator_when_idle = true      # G2
prune_gaia_build_output = true             # G4
followup_rulings = true                    # G10
test_db_prune = true                       # G15
